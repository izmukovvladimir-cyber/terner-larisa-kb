      '<p class="sub">Ответы ты уже дал. Дальше обычно так: закрыл вкладку, покивал сам себе и живёшь как раньше. Если задача правда горит, оставь заявку сейчас.</p>'+
      '<div class="timer"><span id="tmsg">Подарок сгорит<br>через</span><b id="tm">24:00:00</b></div>'+
      '<div id="bk"></div><p class="fin-more"><a href="/prozharka/?gift=1">Что такое Прожарка</a></p>';
  }
  stage.innerHTML='<div class="scr">'+h+'</div>';
  if(window.twemoji) try{twemoji.parse(stage,{folder:'svg',ext:'.svg'})}catch(e){}
  stage.querySelectorAll("[data-id]").forEach(function(el){
    el.value=st.a[el.dataset.id]||"";
    el.addEventListener("input",function(){st.a[el.dataset.id]=el.value; clearTimeout(window._t); window._t=setTimeout(save,400);});
  });
  var fs=document.getElementById("fires");
  if(fs) fs.querySelectorAll(".fire").forEach(function(b){ b.onclick=function(){ st.a[s.id+"_score"]=b.dataset.v; save(); fs.querySelectorAll(".fire").forEach(function(x){ x.classList.toggle("on", +x.dataset.v<=+b.dataset.v); }); var e=document.getElementById("err"); if(e) e.remove(); }; });
  var done=0; Object.keys(qnum).forEach(function(i){ if(+i<st.i) done++; });
  document.getElementById("bar").style.visibility=(st.i>=3&&st.i<last)?"visible":"hidden";
  document.getElementById("bari").style.width=(done/TOTAL*100)+"%";
  document.getElementById("count").textContent=(st.i>=3&&st.i<last)?("Готово "+done+" из "+TOTAL):"Исследование";
  backB.style.display=(st.i>0&&st.i<last)?"block":"none";
  document.getElementById("nav").style.display=st.i===last?"none":"block";
  nextB.disabled=false;
  nextB.textContent=st.i===0?"Участвую":st.i===1?"Дальше":st.i===2?"Забираю, начинаем":st.i===last-1?"Отправить":(s.t==="div"?"Продолжить":"Дальше");
  document.body.classList.toggle("fin",s.t==="done");
  if(s.t==="done"){ if(window.Booking) Booking.mount(document.getElementById("bk"),{page:"issledovanie",gift:true,cta:"Забрать Прожарку"}); timer(); }
  window.scrollTo(0,0);
}
function timer(){
  var t0=0, K="kastdev_fin_t0";
  try{ t0=+localStorage.getItem(K)||0; if(!t0){ t0=Date.now(); localStorage.setItem(K,t0); } }catch(e){ t0=t0||Date.now(); }
  function z(n){return (n<10?"0":"")+n}
  function tick(){
    var el=document.getElementById("tm"); if(!el) return;
    var left=Math.max(0,Math.floor((t0+864e5-Date.now())/1000));
    el.textContent=z(Math.floor(left/3600))+":"+z(Math.floor(left%3600/60))+":"+z(left%60);
    if(!left){ document.getElementById("tmsg").innerHTML="Время вышло, но заявку<br>ещё можно оставить"; return; }
    setTimeout(tick,1000);
  }
  tick();
}
backB.onclick=function(){st.i--; save(); render();};
nextB.onclick=function(){
  if(!valid()) return;
  if(st.i===last-1){send(); return;}
  st.i++; save(); render();
};
function err(msg,el){
  var old=document.getElementById("err"); if(old) old.remove();
  var d=document.createElement("div"); d.id="err"; d.className="err"; d.textContent=msg;
  stage.querySelector(".scr").appendChild(d);
  if(el){ el.classList.add("bad"); el.focus(); el.addEventListener("input",function f(){ el.classList.remove("bad"); var e=document.getElementById("err"); if(e) e.remove(); el.removeEventListener("input",f); }); }
}
function valid(){
  var s=S[st.i];
  if(s.t==="rate"){ if(!st.a[s.id+"_score"]){ err("Выбери, пожалуйста, от 1 до 5 огоньков"); return false; } return true; }
  if(s.t!=="name" && s.t!=="q") return true;
  var els=stage.querySelectorAll("[data-id]:not([data-opt])");
  for(var i=0;i<els.length;i++){ if(!(st.a[els[i].dataset.id]||"").trim()){ err(s.t==="name"?"Напиши, пожалуйста, имя и ник в Telegram, чтобы мы знали, кому ответить":"Напиши хотя бы пару слов, без ответа дальше не пускает",els[i]); return false; } }
  return true;
}
function send(){
  nextB.disabled=true; nextB.textContent="Отправляем…";
  var p={src:"kastdev",who:who,sent:new Date().toISOString()}; Object.keys(st.a).forEach(function(k){p[k]=st.a[k]});
  fetch(HOOK,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(p)})
  .then(function(r){if(!r.ok) throw 0; st.i=last; st.sent=true; save(); render();})
  .catch(function(){nextB.disabled=false; nextB.textContent="Отправить ещё раз"; alert("Не получилось отправить. Проверь интернет и нажми ещё раз, ответы сохранены.");});
}
var root=document.documentElement, tb=document.getElementById("theme");
function dark(){var t=root.getAttribute("data-theme"); return t?t==="dark":matchMedia("(prefers-color-scheme: dark)").matches;}
function paint(){tb.textContent=dark()?"☀ День":"☾ Ночь";}
try{var th=localStorage.getItem("kastdev_theme"); if(th) root.setAttribute("data-theme",th);}catch(e){}
paint(); tb.onclick=function(){var t=dark()?"light":"dark"; root.setAttribute("data-theme",t); try{localStorage.setItem("kastdev_theme",t)}catch(e){} paint();};
if(st.sent) st.i=last;
if(params.get("s")) st.i=+params.get("s");
render();
</script>
</body>
</html>
