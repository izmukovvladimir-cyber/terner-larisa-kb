  var s=S[st.i], h="";
  if(s.t==="cover"){
    h='<div class="hero"><div class="sp"><b style="left:36px;top:60px;font-size:14px;opacity:0.9">✦</b><b style="left:330px;top:96px;font-size:18px;opacity:1">✦</b><b style="left:312px;top:280px;font-size:10px;opacity:0.8">✦</b><b style="left:48px;top:230px;font-size:9px;opacity:0.7">✦</b><b style="left:350px;top:36px;font-size:9px;opacity:0.8">✦</b></div></div><div class="covtxt"><span class="eyebrow">Интервью перед консультацией</span><h1>Ваши деньги:<br><em>честный разговор</em></h1>'+
      '<p class="sub">Несколько вопросов о том, как сейчас устроены ваши деньги и куда вы хотите прийти. Я прочитаю ответы до встречи, и мы начнём сразу с главного.</p>'+
      '<div class="chips"><div class="chip"><b>15 мин</b>в своём темпе</div><div class="chip"><b>Лично</b>ответы вижу я</div><div class="chip"><b>Подарок</b>тетрадь</div></div>'+
      '<p class="sig">Лариса Тернер</p></div>';
  } else if(s.t==="how"){
    h='<div class="big">Здесь нет <em>правильных</em> ответов</div><p class="sub">Пишите как есть, своими словами: коротко или подробно, как удобно.</p>'+
      '<div class="cards">'+
      '<div class="card"><div class="ic">✦</div><p><b>Чем подробнее, тем точнее</b>По вашим словам я заранее вижу картину и на встрече сразу перехожу к сути.</p></div>'+
      '<div class="card"><div class="ic">✦</div><p><b>Польза уже по ходу</b>Когда описываете ситуацию словами, многое становится яснее само.</p></div>'+
      '<div class="card"><div class="ic">✦</div><p><b>Ничего не пропадёт</b>Ответы сохраняются. Отвлечётесь, вернётесь и продолжите с того же места.</p></div></div>';
  } else if(s.t==="name"){
    h=qhead()+'<div class="ql">'+esc(s.l)+'</div><input data-id="q1n" placeholder="Имя"><input data-id="q1t" placeholder="@ник в Telegram">';
  } else if(s.t==="q"){
    h=qhead()+'<div class="ql">'+esc(s.l)+'</div>'+(s.h?'<div class="hint">'+esc(s.h)+'</div>':'')+
      '<textarea data-id="'+s.id+'" placeholder="Ваш ответ"></textarea>';
  } else if(s.t==="opt"){
    var cur=st.a[s.id]||"", bs="";
    s.o.forEach(function(o){ bs+='<button type="button" class="opt'+(o===cur?' on':'')+'" data-o="'+esc(o)+'">'+esc(o)+'</button>'; });
    h=qhead()+'<div class="ql">'+esc(s.l)+'</div><div class="hint">Выберите вариант.</div><div class="opts" id="opts">'+bs+'</div>';
  } else if(s.t==="div"){
    h='<div class="big">'+s.big+'</div><p class="sub">'+s.small+'</p>';
  } else if(s.t==="done"){
    h='<div class="big" style="text-align:center">Спасибо за <em>откровенность</em></div><p class="sub" style="text-align:center">Ответы уже у меня. Я прочитаю каждое слово до нашей встречи.</p>'+
      '<span class="eyebrow" style="display:block;text-align:center;margin:18px 0 0">Ваш подарок</span>'+
      '<div class="book"><div class="pg"></div><div class="cv"><div class="in"><div class="s1">Рабочая тетрадь</div><div class="t">Деньги без автопилота</div><div class="st">✦</div><div class="au">Лариса Тернер</div></div></div></div>'+
      '<p class="price"><s>490 ₽</s><b class="gt">для вас бесплатно</b></p>'+
      '<p class="giftlead">С ней вы увидите, куда деньги уходят на автопилоте, и по шагам вернёте их под свой контроль.</p>'+
      '<a class="btn2" href="'+GIFT+'" target="_blank" rel="noopener">Забрать тетрадь</a>'+
      '<div class="offer"><span class="eyebrow">Главное</span><h2>Стратегическая сессия <em class="gt">по вашим ответам</em></h2>'+
      '<p class="price"><s>15 000 ₽</s><b class="gt">бесплатно</b></p>'+
      '<p class="val">40-45 минут в Zoom. Я уже знаю ваши ответы, поэтому начнём сразу с главного: покажу, где утекают деньги и какой путь ведёт к вашей цели. Уйдёте с планом первых шагов.</p>'+
      '<div class="timer"><span id="tmsg">Бесплатно, если запишетесь<br>в течение</span><b id="tm">24:00:00</b></div>'+
      '<div id="bk"></div></div>';
  }
  document.body.classList.toggle('cov',s.t==='cover');
  stage.innerHTML='<div class="scr">'+h+'</div>';
  if(s.t==="done"){ if(window.Booking) Booking.mount(document.getElementById("bk"),{page:"intervyu",gift:true,cta:"Записаться на сессию",vy:true}); timer(); }
  if(window.twemoji) try{twemoji.parse(stage,{folder:'svg',ext:'.svg'})}catch(e){}
  stage.querySelectorAll("[data-id]").forEach(function(el){
    el.value=st.a[el.dataset.id]||"";
    el.addEventListener("input",function(){st.a[el.dataset.id]=el.value; clearTimeout(window._t); window._t=setTimeout(save,400);});
  });
  var os=document.getElementById("opts");
  if(os) os.querySelectorAll(".opt").forEach(function(b){ b.onclick=function(){ st.a[s.id]=b.dataset.o; save(); os.querySelectorAll(".opt").forEach(function(x){x.classList.toggle("on",x===b)}); var e=document.getElementById("err"); if(e) e.remove(); }; });
  var done=0; Object.keys(qnum).forEach(function(i){ if(+i<st.i) done++; });
  var inQ=st.i>=2&&st.i<last;
  document.getElementById("bar").style.visibility=inQ?"visible":"hidden";
  document.getElementById("bari").style.width=(done/TOTAL*100)+"%";
  document.getElementById("count").textContent=inQ?("Готово "+done+" из "+TOTAL):"Интервью";
  backB.style.display=(st.i>0&&st.i<last)?"block":"none";
  document.getElementById("nav").style.display=st.i===last?"none":"block";
  nextB.disabled=false;
  nextB.textContent=st.i===0?"Начать интервью":st.i===last-1?"Отправить":(s.t==="div"?"Продолжить":"Дальше");
  window.scrollTo(0,0);
}
function timer(){
  var t0=0, K="intervyu_fin_t0";
  try{ t0=+localStorage.getItem(K)||0; if(!t0){ t0=Date.now(); localStorage.setItem(K,t0); } }catch(e){ t0=t0||Date.now(); }
  function z(n){return (n<10?"0":"")+n}
  function tick(){
    var el=document.getElementById("tm"); if(!el) return;
    var left=Math.max(0,Math.floor((t0+864e5-Date.now())/1000));
    el.textContent=z(Math.floor(left/3600))+":"+z(Math.floor(left%3600/60))+":"+z(left%60);
    if(!left){ document.getElementById("tmsg").innerHTML="Время вышло, но заявку<br>ещё можно оставить"; return; }
    setTimeout(tick,1000);
  }
  tick();
}
backB.onclick=function(){st.i--; save(); render();};
nextB.onclick=function(){ if(!valid()) return; if(st.i===last-1){send(); return;} st.i++; save(); render(); };
function err(msg,el){
  var old=document.getElementById("err"); if(old) old.remove();
  var d=document.createElement("div"); d.id="err"; d.className="err"; d.textContent=msg;
  stage.querySelector(".scr").appendChild(d);
  if(el){ el.classList.add("bad"); el.focus(); el.addEventListener("input",function f(){ el.classList.remove("bad"); var e=document.getElementById("err"); if(e) e.remove(); el.removeEventListener("input",f); }); }
}
function valid(){
  var s=S[st.i];
  if(s.t==="opt"){ if(!st.a[s.id]){ err("Выберите, пожалуйста, один вариант"); return false; } return true; }
  if(s.t!=="name" && s.t!=="q") return true;
  var els=stage.querySelectorAll("[data-id]");
  for(var i=0;i<els.length;i++){ if(!(st.a[els[i].dataset.id]||"").trim()){ err(s.t==="name"?"Напишите, пожалуйста, имя и ник в Telegram, чтобы я знала, кому ответить":"Напишите хотя бы пару слов, без ответа дальше не пускает",els[i]); return false; } }
  return true;
}
function flat(){
  // flat keys for Google Sheets: "Q1 Имя", "Q2 ..." + internal block/key marks
  var g={form:"Интервью", "Источник":who, "Имя":st.a.q1n||"", "Ник":st.a.q1t||""};
  S.forEach(function(s,i){ if(!s.id||s.t==="name") return; g["Q"+qnum[i]+" "+s.l.slice(0,60)+(s.k?" [ключ]":"")]=st.a[s.id]||""; });
  return g;
}
function send(){
  nextB.disabled=true; nextB.textContent="Отправляем…";
  var p={src:"intervyu",form:"Интервью консультация",who:who,sent:new Date().toISOString(),blocks:{},keys:[]};
  S.forEach(function(s){ if(s.id){ p.blocks[s.id]=s.b; if(s.k) p.keys.push(s.id); } });
  Object.keys(st.a).forEach(function(k){p[k]=st.a[k]});
  if(GS) try{ fetch(GS,{method:"POST",mode:"no-cors",body:JSON.stringify(flat())}); }catch(e){}
  fetch(HOOK,{method:"POST",headers:{"Content-Type":"text/plain"},body:JSON.stringify(p)})
  .then(function(r){if(!r.ok) throw 0; st.i=last; st.sent=true; save(); render();})
  .catch(function(){nextB.disabled=false; nextB.textContent="Отправить ещё раз"; alert("Не получилось отправить. Проверьте интернет и нажмите ещё раз, ответы сохранены.");});
}
if(st.sent) st.i=last;
if(params.get("s")) st.i=+params.get("s");
render();
</script>
</body>
</html>
