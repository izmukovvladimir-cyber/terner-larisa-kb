ор", "Мотиватор", "Жертва", "Протагонист", "Созерцатель", "Философ"], ["Агрессор", "Стратег", "Протагонист", "Герой", "Спасатель", "Философ"], ["Стратег", "Мотиватор", "Жертва", "Герой", "Спасатель", "Созерцатель"], ["Агрессор", "Мотиватор", "Жертва", "Протагонист", "Созерцатель", "Философ"], ["Агрессор", "Стратег", "Протагонист", "Герой", "Спасатель", "Философ"]], "bank": {"брать": {"about": "Как вы берёте деньги за свою работу: называете цену, просите оплату, поднимаете стоимость.", "sev": "Насколько вас сейчас беспокоит ваш доход?", "q": [{"t": "Клиент говорит: «дорого». Что вы делаете?", "o": ["Спокойно объясняю, что входит в цену. Не подходит, значит не мой клиент.", "Предлагаю сделать часть бесплатно, главное, чтобы человек начал.", "Сразу снижаю цену, а то вообще ничего не будет.", "Цену оставляю, но обещаю сделать вдвое больше, чем договаривались.", "Становится неловко, делаю скидку: у человека трудности.", "Ничего не доказываю. Если человек мой, он вернётся.", "Мне сейчас почти не говорят «дорого»: клиентов мало."]}, {"t": "Как вы назначаете цену на свою работу?", "o": ["Ставлю высоко и торгуюсь до победного.", "Цена вторична, важнее, чтобы у людей получилось.", "Смотрю, сколько берут другие, и ставлю чуть ниже.", "От ценности того, что создаю, и от того, на что мне нужны эти деньги.", "Беру столько, сколько предлагают, обычно это справедливо.", "Долго взвешиваю, имею ли право на такую цену, и откладываю решение."]}, {"t": "Пора поднять цену. Что происходит?", "o": ["Поднимаю резко: кому не нравится, могут уходить.", "Поднимаю по плану, предупреждаю заранее, теряю пару клиентов и иду дальше.", "Поднимаю, когда чувствую, что выросла сама.", "Сначала надо заслужить: ещё одно обучение, ещё один сложный проект.", "Старым клиентам оставляю как было, им и так тяжело.", "Думаю об этом месяцами, советуюсь, но цену не меняю.", "Клиентов сейчас нет, поднимать не для кого."]}, {"t": "Вам недоплатили или задерживают оплату.", "o": ["Напоминаю один раз, спокойно и по договору.", "Не напоминаю. Главное, что работа принесла пользу.", "Молчу и жду, неудобно напоминать.", "Злюсь, но доделываю всё до конца, деньги потом.", "Понимаю: у человека сложности, отдаст, когда сможет.", "Отпускаю, деньги придут другим путём."]}, {"t": "Откуда сейчас ваш основной доход?", "o": ["Из того, что выбиваю: жёсткие переговоры, рывки.", "Из того, что во мне горит: пока зажигаю людей, есть доход.", "Из того, что дают: зарплата, заказы, на условия не влияю.", "Из дела, которое я сама выбрала и строю.", "Из того, что приходит само: рекомендации, повторные клиенты.", "Пока немного: я ещё учусь и готовлюсь брать по-настоящему.", "Сейчас дохода почти нет."]}, {"t": "Что вы чувствуете, когда берёте деньги за свою работу?", "o": ["Победу. Это моё, я это отвоевала.", "Ничего особенного. Это обмен: сделала, мне заплатили.", "Радость: деньги идут на то, что я строю.", "Облегчение. Наконец-то, я столько вложила.", "Неловкость, как будто беру с человека в трудной ситуации.", "Сомнение: а столько ли это стоит?"]}]}, "сохранять": {"about": "Остаются ли у вас деньги после того, как пришли. Без этого рост держится только на ваших силах.", "sev": "Насколько вас сейчас беспокоит, что деньги не задерживаются?", "q": [{"t": "Пришли деньги сверх обычного. Что с ними?", "o": ["Сразу часть откладываю по своему правилу, остальное по плану.", "Вкладываю в людей: обучение команды, подарки, общий проект.", "Уходят на долги и дыры, как всегда.", "Закрываю свои и чужие «пожары», себе ничего не оставляю.", "Помогаю тем, кому сейчас тяжелее.", "Оставляю на счёте, они спокойно лежат.", "Сверх обычного сейчас не приходит."]}, {"t": "Есть ли у вас подушка безопасности?", "o": ["Была, но ушла на очередной рывок.", "Нет. Всё свободное вкладываю в идеи, которые зажигают.", "Нет. Копить кажется бесполезным, всё равно уйдёт.", "Есть, и я знаю, зачем она мне.", "Есть, сложилась сама, я за неё не держусь.", "Деньги отложены, но я так и не решила, где и как их хранить.", "Сейчас откладывать не с чего: дохода почти нет."]}, {"t": "Как вы следите за расходами?", "o": ["Никак. Не хватит, заработаю ещё.", "Есть простая система: знаю, сколько трачу и сколько оставляю.", "Трачу на то, что важно мне, лишнее отсекается само.", "Экономлю на себе, чтобы хватило на всех.", "Не успеваю: деньги всё время уходят на чужие просьбы.", "Скачала приложения, прочитала про бюджет, но пока не веду."]}, {"t": "Близкий просит в долг сумму, которую вы откладывали.", "o": ["Даю только то, что готова потерять. Отложенное не трогаю.", "Даю, если верю в его идею, ещё и подбадриваю.", "Даю, отказать не могу, потом переживаю.", "Даю всё и беру лишнюю работу, чтобы восполнить.", "Даю сразу, ему нужнее. Про возврат не спрашиваю.", "Спокойно отказываю или даю, без внутренней борьбы."]}, {"t": "Что было с вашими сбережениями за последний год?", "o": ["Скачут: то много, то ноль.", "Ушли в проекты и людей, которыми я вдохновилась.", "Их нет, всё съедает текущая жизнь.", "Растут под конкретные цели.", "Лежат ровно, без особых движений.", "Лежат без дела, пока я выбираю, и их ест инфляция.", "Сбережений нет: сейчас дохода почти нет."]}, {"t": "Доход пропал на три месяца. Ваша первая мысль?", "o": ["Заработаю вдвое больше, рывком, как всегда.", "Ничего страшного, это заложено в плане.", "Спокойно продолжу своё дело, запас есть.", "Возьму три подработки и вытяну сама.", "Страшно не за себя, а за тех, кому я помогаю.", "Буду долго разбираться, что делать, и проедать запас."]}]}, "иметь": {"about": "Позволяете ли вы себе большие деньги и капитал, который работает на вас.", "sev": "Насколько вас сейчас беспокоит, что капитал не растёт?", "q": [{"t": "Представьте на счёте сумму в 10 раз больше нынешней. Что вы чувствуете?", "o": ["Сразу раскладываю: под какую цель, в какой инструмент.", "Хочется вложить в людей и идеи, которые меня зажигают.", "Не верю, что это может быть моим. И страшно, что отнимут.", "Ответственность: теперь надо всех вытянуть.", "Сразу думаю, кому помочь.", "Спокойствие. Есть и есть."]}, {"t": "Есть ли у вас капитал, который приносит доход без вашего участия?", "o": ["Был, но я рисковала и потеряла.", "Вложила в чужой проект, отдачи пока нет.", "Нет, у меня ничего не задерживается.", "Есть или строится, под мои цели.", "Деньги есть, но лежат как пришли, без инструмента.", "Изучаю инструменты не первый год, пока не выбрала.", "Пока нет, я к этому только иду."]}, {"t": "Как вы относитесь к большим покупкам для себя?", "o": ["Покупаю, чтобы показать, что могу. Бывает, в долг.", "Покупаю, если вписывается в план.", "Позволяю себе: это моё, и я этого достойна.", "Себе потом. Сначала для других и для дела.", "Неловко тратить на себя, когда у других нет.", "А правильно ли это? Думаю, пока желание не пройдёт."]}, {"t": "Денег стало заметно больше обычного. Что дальше?", "o": ["Ничего не меняется, сумма уходит по плану.", "Загораюсь новым проектом и вкладываю туда.", "Что-то случается: поломка, болезнь, долг, и деньги уходят.", "Беру новые обязательства, становлюсь ещё нужнее всем.", "Кому-то срочно нужна помощь.", "Лежат, мне спокойно."]}, {"t": "Какая фраза ближе всего про крупные деньги?", "o": ["«Заработаю ещё».", "«Давайте вложимся вместе!»", "«Всё равно ничего не задержится».", "«Это моё, и оно работает на мои цели».", "«Не цепляюсь и не боюсь потерять».", "«Сначала разберусь, куда лучше»."]}, {"t": "Что для вас значит «иметь много денег»?", "o": ["Власть и защиту: никто меня больше не прижмёт.", "Свободу выбора и спокойный план.", "Возможность делать то, ради чего я живу.", "Возможность наконец выдохнуть после всего, что вытянула.", "Возможность помогать больше.", "Ответственность, к которой я ещё не готова."]}]}, "получать": {"about": "Умеете ли вы принимать: подарки, помощь, возможности, деньги от хобби.", "sev": "Насколько вам сейчас не хватает лёгкости и помощи в деньгах?", "q": [{"t": "Вам дарят дорогой подарок без повода.", "o": ["Благодарю и думаю, как он мне пригодится.", "Радуюсь и тут же передариваю или делюсь.", "Неловко, думаю, чем теперь отрабатывать.", "Отказываюсь: мне ничего не нужно, я сама.", "«Да не надо, что вы», и чувствую себя обязанной.", "Говорю спасибо и радуюсь."]}, {"t": "Вам предлагают помощь, о которой вы не просили.", "o": ["Настораживаюсь: что им от меня нужно?", "Перенаправляю тому, кому нужнее.", "Принимаю, но потом чувствую себя должной.", "Принимаю, если это совпадает с тем, что я делаю.", "Принимаю с благодарностью.", "Начинаю разбираться, за что мне это."]}, {"t": "Кэшбэк, налоговый вычет, выигрыш, доход от хобби. Как у вас с этим?", "o": ["Не верю в лёгкие деньги. Всё надо брать боем.", "Оформляю всё, что положено: вычеты, кэшбэк, возвраты.", "Хобби приносит деньги, потому что это часть моего дела.", "Некогда, всё время уходит на работу.", "Неудобно просить даже то, что положено.", "Знаю, что можно, но откладываю, хочу сначала разобраться."]}, {"t": "Вам хвалят вашу работу.", "o": ["Благодарю, это совпадает с моей оценкой.", "Перевожу на других: «это вы молодец».", "Смущаюсь: да ладно, ничего особенного.", "Думаю: знали бы вы, чего мне это стоило.", "Мне важнее, что человеку стало лучше.", "Принимаю, мне приятно."]}, {"t": "Неожиданно приходит выгодная возможность.", "o": ["Хватаю, пока не забрали другие.", "Отдаю тому, кому это нужнее.", "Беру, но не верю, что это надолго.", "Беру, если это ведёт к моей цели.", "Принимаю. Значит, так надо.", "Сомневаюсь, взвешиваю, и возможность уходит."]}, {"t": "Когда тяжело, вы просите о помощи?", "o": ["Нет. Требую, если мне должны.", "Прошу по делу у тех, кто может.", "Прошу, когда понимаю, что это нужно для моего дела.", "Нет. Справлюсь сама.", "Нет, я привыкла помогать, а не просить.", "Долго думаю, имею ли право просить.", {"t": "Не прошу, а покупаю: нанимаю специалистов, которые помогут.", "f": "Герой", "flag": "buy"}]}]}, "сотрудничество": {"about": "Как вы работаете с другими людьми: партнёры, команда, рекомендации.", "sev": "Насколько вас сейчас беспокоит, что вы всё тянете одна?", "q": [{"t": "Как складывается работа в паре или команде?", "o": ["Договариваемся о ролях и деньгах на берегу.", "Я заряжаю всех и тяну идею, про свою долю не думаю.", "Мне обычно достаётся меньшая доля, так получается.", "Делаю почти всё сама, так надёжнее.", "Беру на себя чужую часть, чтобы человеку было легче.", "Легко, без борьбы, каждый делает своё.", {"t": "В итоге тащу всё на себе: делают не так, как нужно, и приходится переделывать самой.", "f": "Агрессор", "flag": ""}]}, {"t": "Вас рекомендуют другим?", "o": ["Редко. С людьми часто заканчивается конфликтом.", "Да, но как человека, который вдохновит бесплатно.", "Не знаю. Сама не прошу, а они, наверное, не вспоминают.", "Да, меня передают тем, кому нужно моё дело.", "Да, клиенты приходят по сарафану сами.", "Не прошу, неловко: вдруг я ещё недостаточно хороша."]}, {"t": "Вам предлагают совместный проект.", "o": ["Соглашаюсь, если главная я.", "Смотрю, что даёт каждому, и прописываю доли.", "Соглашаюсь, если это совпадает с моим делом.", "Соглашаюсь, но в итоге тащу всё на себе.", "Соглашаюсь: ему без меня не справиться.", "Долго взвешиваю риски, и проект уходит к другим."]}, {"t": "Партнёрская программа или процент за рекомендацию.", "o": ["Пользуюсь: это честный обмен.", "Рекомендую бесплатно, если продукт меня зажёг.", "Мне не предлагают, а сама не прошу.", "Некогда этим заниматься.", "Брать процент с друзей? Неудобно.", "Если предлагают, принимаю спокойно."]}, {"t": "Конфликт с клиентом или партнёром из-за денег.", "o": ["Иду до конца, своё отвоюю.", "Убеждаю и вдохновляю, лишь бы сохранить отношения.", "Уступаю. Со мной так всегда.", "Отстаиваю важное для дела, остальное отпускаю.", "Ищу спокойный выход, без борьбы.", "Долго разбираю, кто прав, решение затягивается."]}, {"t": "Кто вокруг вас, когда речь о деньгах?", "o": ["Конкуренты и те, кто мне должен.", "Люди, с которыми у нас взаимная выгода и уважение.", "Люди, которые разделяют мои цели.", "Те, кто на меня опирается.", "Те, кому я помогаю.", "Те, с кем интересно обсуждать, но до дела не доходит."]}]}}, "desc": {"брать|Агрессор": ["«Своё надо отвоевать»", "Вы берёте деньги с боем: давите, торгуетесь до ссоры. Деньги приходят рывками, а отношения с клиентами портятся."], "брать|Стратег": ["«Это моя цена»", "Вы спокойно называете цену и знаете, за что её берёте. Не подходит человеку, значит, это не ваш клиент."], "брать|Мотиватор": ["«Главное, чтобы у вас получилось»", "Вам важнее, чтобы у людей получилось, чем то, сколько вы за это получите. Много помогаете бесплатно."], "брать|Жертва": ["«Мне не положено»", "Вы не просите своё, а ждёте, что дадут сами. Соглашаетесь на то, что предложили."], "брать|Протагонист": ["«Зарабатываю на то, что строю»", "Вы берёте деньги за то, что для вас важно.\nХорошо: доход совпадает с вашим делом.\nМешает: нет системы, и доход ограничен тем, что вы успеваете сами."], "брать|Герой": ["«Сначала вытяну, потом возьму»", "Вы берёте на себя нагрузку и ответственность, а не деньги. Разрешаете себе взять, только когда совершили подвиг."], "брать|Спасатель": ["«Как я возьму деньги, если человеку плохо»", "Вам неловко брать деньги за помощь. Вы работаете бесплатно или почти бесплатно."], "брать|Созерцатель": ["«Беру, когда дают»", "Клиенты приходят к вам по доверию, без надрыва.\nМешает: вы сами не предлагаете и не называете цену, а ждёте, когда придут."], "брать|Философ": ["«А правильно ли брать столько?»", "Вы долго думаете, можно ли брать и сколько. Цену не назначаете, решение откладываете."], "сохранять|Агрессор": ["«Не хватит, заработаю ещё»", "Деньги у вас не задерживаются: уходят на рывки, риски и восстановление после срывов."], "сохранять|Стратег": ["«Сначала себе, по правилу»", "Вы откладываете часть каждого дохода и видите свои расходы.\nХорошо: это надёжно.\nМешает: можно увлечься контролем и отказывать себе в жизни."], "сохранять|Мотиватор": ["«Вложусь в тех, кто горит»", "Свободные деньги уходят в людей и чужие идеи, которые вас зажгли. На запас не остаётся."], "сохранять|Жертва": ["«Откладывать бесполезно»", "Всё   if(q.kind==="ready")return "Готовность";
  return q.kind==="stage"?"Ваши деньги сейчас":"Ваши привычки в деньгах";
}
function ask(){
  const q=Q[cur],pct=Math.round(cur/Q.length*100);
  const first=q.right&&q.kind==="fig"&&(cur===0||Q[cur-1].right!==q.right);
  let body;
  if(q.kind==="sev"){
    body=`<div class="scale">${[1,2,3,4,5].map(n=>`<button class="opt" data-v="${n}">${n}</button>`).join("")}</div>
    <div class="scalecap"><span>совсем не беспокоит</span><span>очень беспокоит</span></div>`;
  }else body=`<div class="opts">${q.o.map((o,i)=>`<button class="opt" data-v="${i}">${esc(o.t)}</button>`).join("")}</div>`;
  app.innerHTML=`<div class="stack">
    <div class="meta"><span>${section(q)}</span><span>${cur+1} из ${Q.length}</span></div>
    <div class="bar"><i style="width:${pct}%"></i></div>
    ${first?`<p class="note" style="margin:0">${esc(D.bank[q.right].about)}</p>`:""}
    <div class="qtext">${esc(q.t)}</div>${body}
    ${cur>0?`<button class="btn ghost" id="back">Назад</button>`:""}</div>`;
  app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>{A[cur]=+b.dataset.v;cur++;cur<Q.length?ask():result();window.scrollTo(0,0)});
  const bk=document.getElementById("back"); if(bk)bk.onclick=()=>{cur--;ask()};
}

function score(){
  const R={};
  D.rights.forEach(r=>R[r]={cnt:{},sev:3,healthy:0,none:0});
  const pts={},st={rem:0,cush:0,pas:0};
  let ready=null;
  Q.forEach((q,i)=>{
    const a=A[i];
    if(q.kind==="fig"){if(q.o[a].flag)R[q.right].flag=q.o[a].flag;const f=q.o[a].f;if(!f){R[q.right].none++;return}R[q.right].cnt[f]=(R[q.right].cnt[f]||0)+1;if(D.healthy.includes(f))R[q.right].healthy++}
    else if(q.kind==="sev")R[q.right].sev=a;
    else if(q.kind==="stage")st[q.k]=q.o[a].v;
    else if(q.kind==="pts")Object.entries(q.o[a].s).forEach(([k,v])=>pts[k]=(pts[k]||0)+v);
    else ready=q.o[a];
  });
  D.rights.forEach(r=>{
    const e=Object.entries(R[r].cnt).sort((a,b)=>b[1]-a[1]||(D.healthy.includes(a[0])?1:-1));
    R[r].fig=e[0]?.[0]||null; R[r].second=e[1]&&e[1][1]>=2&&!D.healthy.includes(e[1][0])?e[1][0]:null;
    R[r].st=(!R[r].fig||(r!=="брать"&&R[r].none>=3))?"skip":status(R[r].fig,r);
  });
  // root: first broken right along брать→сохранять→иметь, else weakest of the others
  const broken=r=>R[r].st!=="ok";
  let root=CHAIN.find(broken);
  if(root==="сохранять"&&R[root].st==="skip"&&R["брать"].fig)root="брать";
  if(!root){const rest=["получать","сотрудничество"].filter(broken);
    root=(rest.length?rest:D.rights).slice().sort((a,b)=>R[a].healthy-R[b].healthy||R[b].sev-R[a].sev)[0]}
  const ids=Object.fromEntries(Object.entries(pts).filter(([k])=>D.idres[k]));
  const scs=Object.fromEntries(Object.entries(pts).filter(([k])=>!D.idres[k]));
  const top=o=>Object.entries(o).sort((a,b)=>b[1]-a[1])[0]?.[0];
  let stage=st.pas>=3?4:st.pas>=2?3:(st.cush>=2||st.rem)?2:1;
  const ok=r=>R[r].st==="ok";
  const healthyOn=D.healthy.filter(f=>D.rights.some(r=>R[r].fig===f)).length;
  let inner=!(ok("брать")&&ok("сохранять"))?1:!ok("иметь")?2:(D.rights.every(ok)&&healthyOn===3)?4:3;
  const S1=["Выживальщик","Попрыгунья-Стрекоза","Ждун","Уставший добытчик","Нереализованный потенциал"];
  const id1=Object.entries(ids).filter(([k])=>S1.includes(k)).sort((a,b)=>b[1]-a[1])[0]?.[0]||"Выживальщик";
  return {R,root,id:id1,sc:top(scs),ready,stage,inner};
}

const WAY={"Стратег":"план","Протагонист":"смысл","Созерцатель":"доверие"};
const WAYG={"план":"плана","смысл":"смысла","доверие":"доверия"};
function list(a){return a.length<2?a.join(""):a.slice(0,-1).join(", ")+" и "+a[a.length-1]}
function beBlock(R){
  const tot={};D.rights.forEach(r=>Object.entries(R[r].cnt).forEach(([f,c])=>tot[f]=(tot[f]||0)+c));
  const on=D.healthy.filter(f=>D.rights.some(r=>R[r].fig===f)||(tot[f]||0)>=5).map(f=>WAY[f]), off=D.healthy.map(f=>WAY[f]).filter(w=>!on.includes(w));
  const now=!off.length?"Сейчас у вас работают все три. Ваша задача беречь это равновесие."
    :!on.length?"Сейчас ни один из трёх не работает в полную силу. С этого и начинается рост."
    :`Сейчас у вас ${on.length>1?"работают":"работает"} ${list(on)}, а ${list(off.map(w=>WAYG[w]))} не хватает.`;
  return `<div class="card stack" style="gap:12px"><div class="eyebrow">Ваша опора</div><h2>«Я есть»</h2>
   <p style="margin:0">Есть три здоровых способа обращаться с деньгами: с планом, со смыслом и с доверием.</p>
   <p style="margin:0">Когда работают все три, вы спокойны в деньгах и растёте без надрыва. Это и есть право быть собой.</p>
   <p style="margin:0"><b>${now}</b></p></div>`;
}
const OUTER=[["Выживание","в конце месяца ноль или минус"],["Сохранение и защита","есть запас, пассивного дохода нет"],["Устойчивость и приумножение","пассивный доход есть, но меньше расходов"],["Свобода","пассивный доход больше расходов"]];
const OUTID=[null,"Хранитель безопасности","Хозяин капитала","Архитектор финансовой свободы"];
const INNER=[["Только обязанности","деньги держатся только на ваших силах"],["Право сохранять","право на защиту / безопасность"],["Право иметь","право приумножать"],["Право быть","«Я есть»"]];
function pyr(stage,inner,id,root){
  const rows=[3,2,1,0].map(i=>`<div class="pl ${inner===i+1?"on":""}"><b>${INNER[i][0]}</b><span>${INNER[i][1]}</span></div><div class="pn">${i+1}</div><div class="pl ${stage===i+1?"on":""}"><b>${OUTER[i][0]}</b><span>${OUTER[i][1]}</span></div>`).join("");
  const who=stage===1?esc(id):OUTID[stage-1];
  return `<div class="pyr"><div class="ph">Внутри</div><div></div><div class="ph">Снаружи</div>${rows}</div>
  <div class="stack" style="gap:8px"><p style="margin:0"><b>Снаружи:</b> ступень ${stage}, ${OUTER[stage-1][0].toLowerCase()}. Вы сейчас: <b>${who}</b>.</p>
  <p style="margin:0"><b>Внутри:</b> ${inner===4?"все права открыты.":`закрыт вход: <b>${RN[root][0].toLowerCase()}</b>.`}</p></div>`;
}
function cmp(stage,inner,root){
  if(inner>stage)return ["Внутри вы готовы к ступени выше, чем стоите сейчас.","Мешают не внутренние запреты. Нужны конкретные шаги и инструменты, и делать их можно уже сейчас."];
  if(inner<stage)return ["Снаружи вы стоите выше, чем держат ваши внутренние права.","Так бывает, когда ступень взята через силу, удачу или чужую помощь. Здесь есть риск потерять накопленное: что не держится внутри, рано или поздно уходит снаружи."];
  if(stage===4)return ["Внутри и снаружи вы на вершине.","Задача теперь беречь это равновесие и не уходить в крайности."];
  return ["Внутри и снаружи вы на одном уровне.","Чтобы подняться, мало зарабатывать больше. Нужно открыть "+(stage===3?"право быть":RN[root][0].toLowerCase())+"."];
}
const P=a=>a.map(s=>`<p style="margin:0">${s}</p>`).join("");
function result(){
  const {R,root,id,sc,ready,stage,inner}=score();
  const figs=D.rights.map(r=>R[r].fig).filter(Boolean), uniq=[...new Set(figs)];
  const lead=uniq.map(f=>[f,figs.filter(x=>x===f).length]).sort((a,b)=>b[1]-a[1])[0]||["",0];
  const mosaic=lead[1]>=3?[`Почти везде вы действуете одинаково, как <b>${lead[0]}</b>.`,"Значит, одна и та же привычка проявляется везде: и в доходе, и в накоплениях, и в отношениях с людьми."]
    :["В разных делах с деньгами вы ведёте себя по-разному.","Поэтому в чём-то с деньгами вы уверены, а в чём-то будто другой человек."];
  const links=D.rights.filter(r=>R[r].st!=="ok"&&R[r].st!=="skip");
  const dtext=(r)=>{const x=R[r];
    if(x.st==="skip")return `<p>${r==="сохранять"?"Сейчас сохранять нечего, поэтому это право пока не видно. Оно начнёт работать, когда откроется право брать.":"Сейчас здесь почти нет движения денег, поэтому картина неполная."}</p>`;
    const d=D.desc[r+"|"+x.fig];return `<b>${x.fig}</b> <span class="q">${esc(d[0])}</span>${d[1].split("\n").map(s=>`<p>${esc(s)}</p>`).join("")}${x.second?`<p>Иногда включается ${x.second}.</p>`:""}${x.flag==="buy"?`<p><b>Важно:</b> вы покупаете то, что можно получить: помощь, поддержку, признание. Деньги уходят, а то, за чем вы шли, так и не приходит.</p>`:""}`};
  const row=r=>`<div class="row${r===root?" root":""}"><div class="r">${RN[r][0]}<small>${RN[r][1]}</small></div>
    <div class="f">${dtext(r)}</div><span class="st ${R[r].st}">${STL[R[r].st]}</span></div>`;
  const cm=cmp(stage,inner,root);
  app.innerHTML=`<div class="stack" style="gap:30px">
   <div class="stack" style="gap:12px"><div class="eyebrow">Ваш результат</div><h1>Где вы сейчас</h1>
   <p class="lead" style="margin:0">Слева то, что у вас внутри: какие разрешения в деньгах вы себе даёте.</p>
   <p class="lead" style="margin:0">Справа то, что снаружи: сколько у вас денег и запаса.</p>
   <p class="lead" style="margin:0">Одно всегда тянет за собой другое. Невозможно быть финансово свободным с внутренними блоками и ограничениями.</p></div>
   ${pyr(stage,inner,id,root)}
   <div class="callout stack" style="gap:10px"><div class="eyebrow">Что это значит</div><p style="margin:0"><b>${cm[0]}</b></p><p style="margin:0">${cm[1]}</p></div>

   <div class="stack" style="gap:12px"><h2>Пять сфер ваших денег</h2>
   <p class="lead">Как вы сейчас берёте, сохраняете, имеете, принимаете и работаете с людьми.</p></div>
   <div class="map">${D.rights.map(row).join("")}</div>
   <div class="stack" style="gap:8px">${P(mosaic)}</div>

   <div class="callout stack" style="gap:12px"><div class="eyebrow">С чего начать</div>
    <h2>${RN[root][0]}</h2>
    ${R[root].fig&&R[root].st!=="skip"?`<p style="margin:0">Сейчас здесь работает <b>${R[root].fig}</b>: ${esc(D.desc[root+"|"+R[root].fig][0])}.</p>`:""}
    <p style="margin:0">С него начинается цепочка: когда оно откроется, остальным станет легче.</p>
    <p style="margin:0"><b>Первый шаг:</b> ${STEP[root][0]}</p><p style="margin:0">${STEP[root][1]}</p></div>

   <div class="stack" style="gap:14px"><div class="eyebrow">Как это связано</div>
    <h2>Как одно тянет за собой другое</h2>
    ${links.length?`<div class="chain">${links.map(r=>`<div class="link"><span class="dot"></span><div><b>${RN[r][0]}: ${R[r].fig}</b><br><span class="note">Образ: «${D.sc[R[r].fig][r]}»</span></div></div>`).join("")}</div>
     ${P(["Обычно человек видит только следствие: денег не хватает.","А причина сидит раньше. Сначала право брать, потом сохранять, потом иметь."])}`
     :P(["Явных перекосов нет: во всех сферах вы действуете здорово.",`Точка роста там, где опора слабее всего: ${RN[root][0].toLowerCase()}.`])}
    ${sc?`<p class="note" style="margin:0">Чаще всего вы узнаёте себя в образе «${sc}».</p>`:""}
   </div>

   ${beBlock(R)}

   ${ready?`<p class="note" style="margin:0">Готовность к изменениям: ${esc(ready.r)}.</p>`:""}

   <div class="callout stack" style="gap:12px"><div class="eyebrow">Дальше</div><h3>Разбор с Ларисой</h3>
    <p style="margin:0">Тест показывает, где вы сейчас.</p>
    <p style="margin:0">На разборе мы найдём, откуда это идёт и что поменять в первую очередь.</p>
    <p style="margin:0">Сделайте скриншот этой страницы и пришлите его Ларисе перед консультацией.</p>
    <p style="margin:0"><b>Стоимость теста вычтем из цены консультации.</b></p></div>
   <button class="btn ghost" id="again">Пройти заново</button></div>`;
  again.onclick=intro;
}
const KH=["ca1049cc1d494277e2749622d928b8560f6d2a77d9d446dad1976922052a8248", "19b7913ded3ed0743f380d8677b3ab364d2beca13498f2145689b0accd207050"];
async function sha(s){const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(s));return [...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}
async function unlocked(){
  let k=new URLSearchParams(location.search).get("k");
  if(!k){try{k=localStorage.getItem("kluch_k")}catch(e){}}
  if(!k)return false;
  const ok=KH.includes(await sha(k));
  if(ok){try{localStorage.setItem("kluch_k",k)}catch(e){}}
  return ok;
}
